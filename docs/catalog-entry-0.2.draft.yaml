name: ld-workbench
title: Debate Workbench
repo: https://github.com/Dgardenhire/hermes-ld-workbench
sha: cd3646f12e5664f363f798ad7073666112c040cf
description: "Practice speech and debate out loud: Lincoln-Douglas, extemp and rhetoric. Speeches are recorded and timed with a real clock and the timekeeper's cards; a transcript, words a minute, pauses and fillers are worked out on this computer. Extemp pulls this week's headlines on the student's topic from outlets on the left, the center and the right, side by side and labeled by lean, draws three questions from the student's own saved news, and runs 30 minutes of prep and a 7-minute speech. Rhetoric marks the figures in public-domain speeches, checking every quote against the text. A judge's ballot follows every round, and every ballot is kept so patterns show across rounds. Lincoln-Douglas keeps the case workbench, topic briefing, full NSDA practice round against an AI opponent and fallacies tools. Every model call goes to the user's own Hermes model through the plugin LLM helper. Debate Workbench is an independent community plugin. It is not made or endorsed by Nous Research, the National Speech & Debate Association, AllSides or any news outlet. Disclosure — microphone: opened only while the student presses Start speaking, and stopped on finish, cancel, error or leaving the page; recordings: saved only in $HERMES_HOME/plugin-data/ld-workbench/recordings/, newest 20 and at most 100 MB kept, delete-all button; transcribed on the Hermes backend with faster-whisper when Hermes's local speech-to-text is installed (no dependency declared); on first use faster-whisper downloads its speech model from huggingface.co (no audio is sent); with a remote Hermes backend, the recording is sent to that backend. Network calls of its own, only when the student presses a button: (1) headline pull: a Google News RSS search per outlet on the student's list, plus those outlets' own RSS feeds as fallback (https only, listed hosts only, public addresses checked, 8-second timeout, 250 KB cap, headlines and links only, no article text); (2) a link the student saves to the extemp file or adds as a topic source (one public page, checked on every redirect, 20-second timeout, first 30,000 characters). No credentials, telemetry, shell commands, background processes that outlive a request, or self-updates. Registers no tools, hooks or middleware, only a Desktop page and a dashboard API. Stores cases, rounds, ballots, briefings, takes, the extemp file and headline pulls in $HERMES_HOME/plugin-data/ld-workbench/. Reads a .docx, .txt or backup file only when the user picks one; writes an export only to a path the user picks in the save dialog. No private Hermes imports."
