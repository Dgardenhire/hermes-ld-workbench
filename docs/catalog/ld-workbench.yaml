name: ld-workbench
title: Debate Workbench
repo: https://github.com/Dgardenhire/hermes-ld-workbench
sha: SHA_PLACEHOLDER
description: >-
  Practice speech and debate out loud: extemp, Lincoln-Douglas and rhetoric. You speak on a real clock, and a
  practice judge on your own Hermes model writes a ballot that quotes your lines. A coach asks questions first and
  writes nothing into your case until you press Add. Ballots are kept, and patterns are counted across them.
  An independent community plugin, not made or endorsed by Nous Research, the National Speech & Debate
  Association, AllSides or any news outlet. Registers a Desktop page, a dashboard API, the /debate command, two
  read-only agent tools (debate_record, debate_today; both refuse in scheduled jobs), three model rows and a
  debate-coach skill; no hooks, middleware or env vars.
  Disclosure: the microphone opens only while you press Start speaking; recordings, transcripts, cases, ballots and
  your extemp file stay in $HERMES_HOME/plugin-data/ld-workbench/, with delete buttons in Settings; takes go to
  Hermes's speech-to-text (a cloud provider gets a take only when you press Transcribe now on it) or to the
  plugin's own speech model, downloaded from huggingface.co (about 145 MB) only on a press; its own network calls
  start on a button (Pull headlines from Google News RSS and outlet feeds, Get up to speed opening up to 4 public
  pages from your Hermes web search, a link you save), https and public addresses only, with time and size caps;
  model calls go to your own Hermes model, and with coach examples on, one runs in the background after each
  60-second answer; no credentials, telemetry, background jobs or self-updates.
maintainer: Dgardenhire
