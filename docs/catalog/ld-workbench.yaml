sha: PINSHA
description: "Practice speech and debate out loud: Lincoln-Douglas, extemp and rhetoric. Speeches are recorded and timed with a real clock and the timekeeper's cards; pauses are measured on this computer, and the transcript, words a minute and fillers come from the user's own Hermes speech-to-text. Extemp pulls this week's headlines on the student's topic from outlets on the left, the center and the right, side by side and labeled by lean, draws three questions from the student's own saved news, and runs 30 minutes of prep and a 7-minute speech. Rhetoric marks the figures in public-domain speeches, checking every quote against the text. A judge's ballot follows every round, and every ballot is kept so patterns show across rounds. Lincoln-Douglas keeps the case workbench, topic briefing, full NSDA practice round against an AI opponent and fallacies tools. After the student tries, a coach on the user's own model can show a strong answer, opening or line, model a redo of the weakest moment on a ballot, suggest areas and evidence from the student's own extemp file, and draft contentions, a framework or a block for the student to rewrite; each is marked as the coach's, extemp examples cite only headlines in the student's own file, and code checks every citation, quote, figure and date before the page shows it. A teacher can turn examples off in Settings. A coach chat on every screen answers about what is on it. Every model call goes to the user's own Hermes model through the plugin LLM helper. Debate Workbench is an independent community plugin. It is not made or endorsed by Nous Research, the National Speech & Debate Association, AllSides or any news outlet. Disclosure — microphone: opened only while the student presses Start speaking, and stopped on finish, cancel, error or leaving the page; recordings: saved only in $HERMES_HOME/plugin-data/ld-workbench/recordings/, newest 20 and at most 100 MB kept, delete-all button; transcribed by the user's own Hermes speech-to-text (Settings, Voice; if that is a cloud provider, or Hermes would pick one at run time, a take goes to it only when the student presses Transcribe now on that take, after the take names the provider; never on its own), through a guarded private import of tools.voice_mode.transcribe_recording (the function behind Hermes's /api/audio/transcribe; a plugin page cannot reach that route); when Hermes cannot without downloading a model of its own, or fails, faster-whisper on the Hermes backend when Hermes's local speech-to-text installed it (no dependency declared), with its speech model in $HERMES_HOME/plugin-data/ld-workbench/models/, downloaded from huggingface.co only when the student presses Transcribe now (no audio is sent; a new recording never starts the download), in one separate Python process with fixed arguments and private Hugging Face settings; with a remote Hermes backend, the recording is sent to that backend. Settings deletes all recordings, or all transcripts and ballots. Network calls of its own, only when the student presses a button: (1) headline pull: a Google News RSS search per outlet on the student's list, plus those outlets' own RSS feeds as fallback (https only, listed hosts only, public addresses checked, 8-second timeout, 250 KB cap, headlines and links only, no article text); (2) a link the student saves to the extemp file or adds as a topic source (one public page, checked on every redirect, 20-second timeout, first 30,000 characters). In an extemp round the student starts with internet allowed, a search the student types during prep goes to the user's own Hermes web_search tool (whatever search backend they set up in Hermes; no key or scraper in the plugin), and only titles, links and snippets come back. When the student presses Hear it, the AI opponent's speech text goes to the user's own Hermes text_to_speech tool (their configured voice provider); the audio is kept in $HERMES_HOME/plugin-data/ld-workbench/voice/, newest 8. No credentials, telemetry, shell commands or self-updates; transcription runs in one worker thread inside Hermes (ffmpeg converts a take to WAV only when PyAV is missing) and the model unloads after 5 idle minutes. Every model call carries its own 180-second limit. Links open in the user's browser; if Hermes cannot open one, the link is shown to copy. Registers a Desktop page, a dashboard API, a /debate command, two read-only agent tools (debate_record and debate_today: counts, tags, dates and question text only, never a transcript or a judge's written reasons; both refuse in cron runs), three model rows in Settings, Models, Auxiliary (Debate judge, Debate opponent, Debate coach; 180-second timeout, the main model unless changed) and a bundled skill, debate-coach. No hooks or middleware. Stores cases, rounds, ballots, briefings, takes, the extemp file and headline pulls in $HERMES_HOME/plugin-data/ld-workbench/. Reads a .docx, .txt or backup file only when the user picks one; writes an export only to a path the user picks in the save dialog (never into a hidden folder or ~/Library), or into its own exports folder. Web search and Hear it go through Hermes's public tool registry (tools.registry, the call ctx.dispatch_tool makes); the one private Hermes import is tools.voice_mode, for transcripts, with a fallback."
