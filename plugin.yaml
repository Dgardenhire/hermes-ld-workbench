# Debate Workbench for Hermes. name is the registry key; label is the display name.
manifest_version: 2
name: ld-workbench
label: Debate Workbench
version: 0.2.0
description: Practice speech and debate out loud. Lincoln-Douglas rounds against an AI opponent, extemp from this week's headlines on both sides, and rhetoric drills on real speeches. Every speech is timed with a real clock and the timekeeper's cards, and a judge's ballot follows, with patterns counted across rounds. Uses your own Hermes model. You try first; then the coach can show a strong version, marked as the coach's, with every citation checked against your own file. A teacher can turn examples off.
author: Damon Gardenhire
license: MIT
kind: standalone
requires_hermes: ">=0.22.0"
tags: [debate, speech, education, desktop]
provides_tools: []
provides_hooks: []
