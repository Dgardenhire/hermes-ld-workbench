<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Debate Workbench card</title>
<!-- Catalog card, 0.2. The picture is the real speaking screen (docs/shots/v02/extemp-speaking-dark.png,
     made by harness/live.mjs), cropped, not redrawn. Render at exactly 1200x600 from the repo root:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
       --hide-scrollbars --window-size=1200,600 --virtual-time-budget=4000 \
       --screenshot=docs/card.png "file://$PWD/docs/card.html" -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ground:#0e1116;--ink:#e6edf3;--rule:#2a3039;
  --cond:"Avenir Next Condensed","DIN Condensed","Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html,body{width:1200px;height:600px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--sans)}
.name{position:absolute;left:44px;top:52px;width:250px}
.name h1{font-family:var(--cond);font-weight:700;font-size:42px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.name p{margin-top:22px;font-size:17px;line-height:1.45}
.events{position:absolute;left:44px;bottom:48px;width:240px;list-style:none;font-family:var(--cond);font-weight:700;font-size:19px;
  text-transform:uppercase;letter-spacing:.02em;line-height:1.55}
.shot{position:absolute;right:0;top:0;width:906px;height:600px;overflow:hidden;border-left:1px solid var(--rule)}
/* source crop: x 430-1426, y 40-702 of the 1440x900 screenshot, scaled to 600px tall */
.shot img{position:absolute;width:1306px;height:auto;left:-390px;top:-36px}
</style></head>
<body>
  <div class="name">
    <h1>Debate<br>Workbench</h1>
    <p>Speak on a real clock. Get the ballot a judge would write.</p>
  </div>
  <ul class="events"><li>Lincoln-Douglas</li><li>Extemp</li><li>Rhetoric</li></ul>
  <div class="shot"><img src="shots/v02/extemp-speaking-dark.png" alt="A 60-second answer while speaking: the clock at 0:43, the time cards, the voice drawn as it comes in"></div>
</body></html>
