known_issues:
  - "Tested on macOS. Windows and Linux are untested."
  - "The judge and the coach are an AI on the model you chose in Hermes. Their points are practice feedback, not a real judge's."
  - "Hermes's speech-to-text returns no word times, so exact line playback and the answer-in-the-first-10-seconds measure work only with the plugin's own speech model."
  - "Transcription imports tools.voice_mode.transcribe_recording, which is not in Hermes's public plugin API. It is guarded and falls back to the plugin's own faster-whisper, so a Hermes release that moves it can turn off Hermes-backed transcription."
  - "To open at once, the page keeps a copy of its last answers (each under 200,000 characters, with secret-looking values removed) in the plugin's own Hermes storage, and shows it until the backend answers."
  - "Start or stop speaking has a keybind with no default key; set one in Keyboard settings."
capabilities:
  provides_tools:
    - debate_record
    - debate_today
  provides_hooks: []
  provides_middleware: []
  requires_env: []
