# Debate Workbench for Hermes. name is the registry key; label is the display name.
manifest_version: 2
name: ld-workbench
label: Debate Workbench
version: 0.2.0
description: Practice speech and debate out loud. Lincoln-Douglas rounds against an AI opponent, extemp from this week's headlines, and rhetoric drills, each timed and judged on a ballot that quotes what you said. You try first; then a coach on your own Hermes model can show a strong version. In any chat, /debate gives today's question and your top counted pattern.
author: Damon Gardenhire
license: MIT
kind: standalone
requires_hermes: ">=0.21.6"
tags: [debate, speech, education, desktop]
provides_tools: [debate_record, debate_today]
provides_hooks: []
