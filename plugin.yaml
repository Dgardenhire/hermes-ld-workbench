# Debate Workbench for Hermes. name is the registry key; label is the display name.
manifest_version: 2
name: ld-workbench
label: Debate Workbench
version: 0.1.0
description: Practice Lincoln-Douglas debate. Build your own case with a coach that asks hard questions, then debate a full NSDA practice round against an AI opponent and get a judge's ballot. Uses your own Hermes model. It never writes your case for you.
author: Damon Gardenhire
license: MIT
kind: standalone
requires_hermes: ">=0.22.0"
tags: [debate, education, desktop]
provides_tools: []
provides_hooks: []
